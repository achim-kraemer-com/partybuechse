<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Partybüchse">
    <!-- Fuer purpose="maskable": randlos, weil das System die Form schneidet, und das Zeichen
         kleiner, damit es in der Sicherheitszone von 80 Prozent bleibt. -->
    <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b5cf6"/>
            <stop offset="1" stop-color="#3b82f6"/>
        </linearGradient>
    </defs>
    <rect width="512" height="512" fill="url(#g)"/>
    <text x="256" y="319" font-family="Lexend, Arial, Helvetica, sans-serif" font-size="176" font-weight="800" fill="#fff" text-anchor="middle">PB</text>
</svg>
