monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - spotify

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Jeder Fehler, aus jedem Kanal, in einer eigenen Datei. Nicht abgefangene
            # Ausnahmen protokolliert Symfony im Kanal "request" – der unten aus dem
            # Mitschnitt ausgeschlossen ist. Ohne diesen Handler bleibt also genau das
            # unsichtbar, was man nach einem 500er sucht. Ein eigener Pfad, damit ein
            # Fehler nicht zwischen hunderten Zeilen Mitschnitt untergeht:
            #   tail -f var/log/prod.error-*.log
            errors:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.error.log"
                level: error
                max_files: 14

            # Mitschnitt des normalen Betriebs neben php://stderr. Unter Plesk landet
            # stderr in einem PHP-FPM-Log, an das man ohne root nicht herankommt – damit
            # war nach einer Party nicht nachvollziehbar, was die Partybüchse getan hat.
            # var/log liegt ausserhalb der Dokumentwurzel (public/).
            file:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: info
                max_files: 7
                # "request" schreibt bei jedem Poll den Routen-Treffer, "http_client" jeden
                # einzelnen Spotify-Aufruf: zu zweit stellten sie 2274 von 2286 Zeilen des
                # ersten Tages. Fehler aus beiden Kanaelen holt der "errors"-Handler.
                channels: ["!event", "!deprecation", "!request", "!http_client"]
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
