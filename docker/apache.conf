# Serves public/ as document root; every unknown path goes to Symfony's front controller.
ServerName partybuechse
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # static assets: cache for a day
    <LocationMatch "\.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$">
        Header set Cache-Control "public, max-age=86400"
    </LocationMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
